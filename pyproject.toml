[project]
name = "doonex"
version = "0.1.0"
description = "Single-agent local programming workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "openhands-sdk==1.60.1",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
doonex = "doonex.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/server/doonex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires Docker and pinned task image", "postgres: requires private test PostgreSQL", "live: requires explicitly authorized model credentials and budget"]

[tool.ruff]
target-version = "py312"
